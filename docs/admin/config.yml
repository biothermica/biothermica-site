backend:
  name: github
  repo: biothermica/biothermica-site
  branch: main
  base_url: https://suresh-issue-82.dcycleproject.org
  auth_endpoint: /auth/github/repo/69854552314079e1b66d994f

media_folder: "docs/sites/biothermica.com/files"
public_folder: "docs/sites/biothermica.com/files"

collections:
  - name: "en_air_pollution_control_projects"
    label: "EN Air Pollution Control Projects"
    folder: "docs/air-pollution-control/projects"
    create: true
    nested:
      depth: 3
    extension: "html"
    format: "frontmatter"
    slug: "{{fields.project_id}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category ID", name: "category_id", widget: "string" }
      - { label: "Project ID", name: "project_id", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "default2" }
    filter:
      field: "lang"
      value: "en"

  - name: "en_assainissement_projets"
    label: "EN Assainissement Projets"
    folder: "docs/assainissement/projets"
    create: true
    nested:
      depth: 3
    extension: "html"
    format: "frontmatter"
    slug: "{{fields.project_id}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category ID", name: "category_id", widget: "string" }
      - { label: "Project ID", name: "project_id", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "content" }
    filter:
      field: "lang"
      value: "en"

  - name: "en_carbon_and_energy"
    label: "EN Carbon And Energy"
    folder: "docs/carbon-and-energy"
    create: true
    extension: "html"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "content" }
    filter:
      field: "lang"
      value: "en"

  - name: "en_content"
    label: "Contents (EN)"
    folder: "docs/content"
    # nested:
    #   depth: 3
    extension: "html"
    create: true
    delete: true
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "content" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "RSS Feed Title", name: "rss_feed_title", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Path EN", name: "path_en", widget: "string", required: false }
      - { label: "Path FR", name: "path_fr", widget: "string", required: false }

      - label: "Page Content (HTML)"
        name: "body"
        widget: "code"
        default_language: "html"
        output_code_only: true

    filter:
      field: "lang"
      value: "en"


  - name: "en_documents"
    label: "Documents (EN)"
    folder: "docs/documents"
    # nested:
    #   depth: 3
    extension: "html"
    create: true
    delete: true
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "document" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "RSS Feed Title", name: "rss_feed_title", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Path EN", name: "path_en", widget: "string", required: false }
      - { label: "Path FR", name: "path_fr", widget: "string", required: false }

      - label: "Page Content (HTML)"
        name: "body"
        widget: "code"
        default_language: "html"
        output_code_only: true

    filter:
      field: "lang"
      value: "en"

  - name: "en_tags"
    label: "Tags (EN)"
    folder: "docs/tags"
    # nested:
    #   depth: 3
    extension: "html"
    create: true
    delete: true
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "tag" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "RSS Feed Title", name: "rss_feed_title", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Path EN", name: "path_en", widget: "string", required: false }
      - { label: "Path FR", name: "path_fr", widget: "string", required: false }
      - { lalabel: "Term ID", name: "termId", widget: "number", value_type: "int" }

      - label: "Page Content (HTML)"
        name: "body"
        widget: "code"
        default_language: "html"
        output_code_only: true

    filter:
      field: "lang"
      value: "en"
  
  - name: "en_pages"
    label: "English Pages"
    folder: "docs"
    extension: "html"
    create: true
    delete: true
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "default" }
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "RSS Feed Title", name: "rss_feed_title", widget: "string", required: false }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Path EN", name: "path_en", widget: "string", required: false }
      - { label: "Path FR", name: "path_fr", widget: "string", required: false }

      - label: "Page Content (HTML)"
        name: "body"
        widget: "code"
        default_language: "html"
        output_code_only: true

    filter:
      field: "lang"
      value: "en"


